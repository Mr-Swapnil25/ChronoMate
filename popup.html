<!DOCTYPE html>
<html lang="en">
<head>
    <title>PCA Extractor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
    <style>
        :root {
            /* New color scheme */
            --primary: #3B82F6;            /* Cool Blue */
            --primary-dark: #2563EB;       /* Darker variant */
            --primary-light: #E0F2FE;      /* Soft Sky Blue */
            --secondary: #10B981;          /* Emerald Green */
            --secondary-light: rgba(16, 185, 129, 0.1);
            --background: #F9FAFB;         /* Soft White */
            --surface: #FFFFFF;            /* Pure White */
            --on-primary: #FFFFFF;         /* White text on primary */
            --on-surface: #111827;         /* Charcoal Black */
            --on-background: #6B7280;      /* Medium Gray */
            --divider: #E5E7EB;            /* Light Gray */
            --error: #F87171;              /* Soft Red */
            --error-light: rgba(248, 113, 113, 0.1);
            --hover-overlay: rgba(59, 130, 246, 0.04); /* Very light blue for hover effects */
            
            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            
            /* Spacing */
            --spacing-xs: 4px;
            --spacing-s: 8px;
            --spacing-m: 16px;
            --spacing-l: 24px;
            --spacing-xl: 32px;
            
            /* Border radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            
            /* Transitions */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
            --transition-slow: 0.4s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: var(--spacing-m);
            width: 460px;
            box-sizing: border-box;
            background-color: var(--background);
            color: var(--on-surface);
            line-height: 1.5;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: var(--spacing-l);
            padding-bottom: var(--spacing-m);
            border-bottom: 1px solid var(--divider);
        }

        .header-icon {
            margin-right: var(--spacing-m);
            color: var(--primary);
            background-color: var(--primary-light);
            padding: var(--spacing-s);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--transition-fast), background-color var(--transition-fast);
        }
        
        .header-icon:hover {
            transform: scale(1.05);
            background-color: rgba(59, 130, 246, 0.15);
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            color: var(--on-surface);
        }

        .actions {
            display: flex;
            gap: var(--spacing-m);
            flex-wrap: wrap;
            margin-bottom: var(--spacing-l);
        }

        .main-action {
            flex: 1;
            min-width: 200px;
        }

        .secondary-actions {
            display: flex;
            gap: var(--spacing-s);
        }
        
        button {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary);
            color: var(--on-primary);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-normal);
            position: relative;
        }

        button:hover {
            background-color: var(--primary-dark);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        button .material-icons-round {
            font-size: 18px;
            margin-right: var(--spacing-xs);
        }
        
        /* Tooltip styles */
        button[data-tooltip] {
            position: relative;
        }
        
        button[data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--on-surface);
            color: var(--surface);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            white-space: nowrap;
            font-size: 12px;
            opacity: 0;
            animation: fadeIn 0.2s forwards;
            z-index: 10;
        }
        
        @keyframes fadeIn {
            to { opacity: 0.9; }
        }

        #downloadCSV {
            background-color: var(--secondary);
        }

        #downloadCSV:hover {
            background-color: #0CA678; /* Darker green */
        }
        
        #downloadCSV:focus {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3);
        }

        #refreshButton {
            background-color: transparent;
            color: var(--on-background);
            border: 1px solid var(--divider);
            box-shadow: none;
            border-radius: var(--radius-full);
            padding: 10px;
            width: 40px;
            height: 40px;
        }

        #refreshButton:hover {
            background-color: var(--hover-overlay);
            color: var(--primary);
            border-color: var(--primary-light);
            transform: rotate(30deg) translateY(-1px);
        }
        
        #refreshButton .material-icons-round {
            margin-right: 0;
            transition: transform var(--transition-normal);
        }
        
        #refreshButton:hover .material-icons-round {
            transform: rotate(30deg);
        }

        .tabs {
            display: flex;
            margin-bottom: var(--spacing-m);
            border-bottom: 1px solid var(--divider);
            gap: var(--spacing-m);
            padding-bottom: 2px;
        }

        .tab {
            padding: var(--spacing-s) var(--spacing-s);
            cursor: pointer;
            font-weight: 500;
            color: var(--on-background);
            position: relative;
            transition: all var(--transition-normal);
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        }

        .tab:hover {
            color: var(--primary);
            background-color: var(--hover-overlay);
        }

        .tab.active {
            color: var(--primary);
            font-weight: 600;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary);
            border-radius: var(--radius-full);
            transition: all var(--transition-normal);
        }

        .card {
            background-color: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: var(--spacing-l);
            margin-bottom: var(--spacing-m);
            border: 1px solid var(--divider);
            transition: box-shadow var(--transition-normal);
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-m);
        }

        h2 {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            color: var(--on-surface);
        }

        .result-list {
            max-height: 220px;
            overflow-y: auto;
            border-radius: var(--radius-md);
            background-color: var(--background);
            scrollbar-width: thin;
            scrollbar-color: var(--primary-light) var(--background);
        }

        .result-list::-webkit-scrollbar {
            width: 6px;
        }

        .result-list::-webkit-scrollbar-track {
            background: var(--background);
            border-radius: var(--radius-full);
        }

        .result-list::-webkit-scrollbar-thumb {
            background-color: var(--primary-light);
            border-radius: var(--radius-full);
        }

        .result-list::-webkit-scrollbar-thumb:hover {
            background-color: var(--primary);
        }

        .result-item {
            padding: var(--spacing-m);
            border-bottom: 1px solid var(--divider);
            transition: background-color var(--transition-normal), transform var(--transition-normal);
        }

        .result-item:hover {
            background-color: var(--hover-overlay);
            transform: translateX(2px);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item p {
            margin: var(--spacing-xs) 0;
        }

        .result-item span {
            font-weight: 600;
            color: var(--primary);
        }

        .date-value {
            color: var(--secondary);
            font-weight: 500;
            background-color: var(--secondary-light);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            transition: background-color var(--transition-fast);
        }
        
        .date-value:hover {
            background-color: rgba(16, 185, 129, 0.2);
        }
        
        .sender-value, .recipient-value {
            font-weight: 500;
        }
        
        .recipient-value {
            color: var(--primary);
            background-color: rgba(59, 130, 246, 0.1);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            white-space: nowrap;
            transition: background-color var(--transition-fast);
        }
        
        .recipient-value:hover {
            background-color: rgba(59, 130, 246, 0.2);
        }
        
        .recipient-info {
            margin-bottom: var(--spacing-m);
            padding: var(--spacing-s) var(--spacing-m);
            background-color: var(--background);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--primary);
            transition: transform var(--transition-normal);
        }
        
        .recipient-info:hover {
            transform: translateX(2px);
        }
        
        .recipient-info .label {
            font-weight: 600;
            color: var(--on-background);
            margin-right: var(--spacing-xs);
        }
        
        .email-metadata {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-s) var(--spacing-m);
            margin: var(--spacing-xs) 0 var(--spacing-s);
        }
        
        .email-metadata p {
            margin: 0;
        }

        .snippet-text {
            color: var(--on-background);
            font-size: 13px;
            margin-top: var(--spacing-s);
            line-height: 1.4;
            padding-left: var(--spacing-s);
            border-left: 2px solid var(--divider);
        }

        .no-results, .loading {
            padding: var(--spacing-l);
            text-align: center;
            color: var(--on-background);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            font-size: 14px;
        }

        .no-results .material-icons-round, 
        .loading .material-icons-round {
            font-size: 24px;
            margin-bottom: var(--spacing-s);
            opacity: 0.7;
        }

        .error {
            padding: var(--spacing-m);
            text-align: center;
            color: var(--error);
            font-weight: 500;
            background-color: var(--error-light);
            border-radius: var(--radius-md);
            border: 1px solid rgba(248, 113, 113, 0.2);
            margin: var(--spacing-m) 0;
            animation: errorPulse 2s infinite;
        }
        
        @keyframes errorPulse {
            0% { background-color: var(--error-light); }
            50% { background-color: rgba(248, 113, 113, 0.15); }
            100% { background-color: var(--error-light); }
        }

        .error-help {
            font-size: 13px;
            color: var(--on-background);
            font-weight: normal;
            margin-top: var(--spacing-s);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-m);
            color: var(--on-background);
        }

        /* Enhanced spinner and progress indicators */
        .spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(59, 130, 246, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            margin-bottom: var(--spacing-s);
            animation: spin 1s linear infinite;
        }
        
        .progress-container {
            width: 100%;
            max-width: 250px;
            height: 4px;
            background-color: var(--primary-light);
            border-radius: var(--radius-full);
            margin: var(--spacing-s) 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            border-radius: var(--radius-full);
            transition: width 0.3s ease;
            animation: progressIndeterminate 1.5s infinite linear;
        }
        
        @keyframes progressIndeterminate {
            0% { width: 0%; margin-left: -50%; }
            50% { width: 50%; }
            100% { width: 0%; margin-left: 100%; }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Badge styles for counts */
        .badge {
            background-color: var(--primary-light);
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            margin-left: var(--spacing-s);
            transition: all var(--transition-fast);
        }
        
        .badge:hover {
            background-color: rgba(59, 130, 246, 0.2);
            transform: scale(1.05);
        }
        
        /* Toast notification for success/errors */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: var(--spacing-s) var(--spacing-m);
            border-radius: var(--radius-md);
            background-color: var(--surface);
            color: var(--on-surface);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            font-size: 14px;
            opacity: 0;
            transition: opacity var(--transition-normal), transform var(--transition-normal);
            z-index: 1000;
        }
        
        .toast.success {
            background-color: var(--secondary);
            color: white;
        }
        
        .toast.error {
            background-color: var(--error);
            color: white;
        }
        
        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }
        
        .toast .material-icons-round {
            margin-right: var(--spacing-s);
        }
        
        /* Status indicator for extraction progress */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            font-size: 12px;
            color: var(--on-background);
            margin-left: auto;
        }
        
        .status-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        
        .status-indicator .dot.idle {
            background-color: var(--divider);
        }
        
        .status-indicator .dot.running {
            background-color: var(--primary);
            animation: pulse 1.5s infinite;
        }
        
        .status-indicator .dot.success {
            background-color: var(--secondary);
        }
        
        .status-indicator .dot.error {
            background-color: var(--error);
        }
        
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #60A5FA;        /* Lighter blue for dark mode */
                --primary-dark: #3B82F6;   /* Normal blue for dark mode */
                --primary-light: #172554;  /* Dark blue background */
                --secondary: #34D399;      /* Brighter green for dark mode */
                --secondary-light: rgba(52, 211, 153, 0.15);
                --background: #111827;     /* Dark background */
                --surface: #1F2937;        /* Darker surface */
                --on-primary: #111827;     /* Dark text on primary */
                --on-surface: #F9FAFB;     /* Light text on surface */
                --on-background: #9CA3AF;  /* Light gray text */
                --divider: #374151;        /* Dark divider */
                --error: #F87171;          /* Same error color */
                --error-light: rgba(248, 113, 113, 0.15);
                --hover-overlay: rgba(96, 165, 250, 0.1); /* Light blue overlay */
            }
            
            .error {
                background-color: var(--error-light);
                border-color: rgba(248, 113, 113, 0.3);
            }
            
            .spinner {
                border-color: rgba(96, 165, 250, 0.2);
                border-top-color: var(--primary);
            }
            
            button[data-tooltip]:hover::after {
                background-color: var(--surface);
                color: var(--on-surface);
                border: 1px solid var(--divider);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-icon">
            <span class="material-icons-round">data_object</span>
        </div>
        <h1>PCA Extractor</h1>
        <div class="status-indicator">
            <div class="dot idle" id="statusDot"></div>
            <span id="statusText">Ready</span>
        </div>
    </div>

    <div class="actions">
        <button id="extractAllButton" class="main-action" data-tooltip="Extract PCA information from current email and inbox">
            <span class="material-icons-round">search</span>
            Extract PCA from Email & Inbox
        </button>
        <div class="secondary-actions">
            <button id="downloadCSV" aria-label="Download Inbox Matches as CSV" data-tooltip="Export results to CSV file">
                <span class="material-icons-round">download</span>
                CSV
            </button>
            <button id="refreshButton" aria-label="Refresh Results" data-tooltip="Refresh extraction results">
                <span class="material-icons-round">refresh</span>
            </button>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" id="currentTab" role="tab" aria-selected="true" tabindex="0">
            Current Email
        </div>
        <div class="tab" id="inboxTab" role="tab" aria-selected="false" tabindex="0">
            Inbox Search
        </div>
    </div>

    <div class="card" id="currentEmailSection">
        <div class="section-header">
            <h2>Current Email Results</h2>
        </div>
        <div id="currentEmailResults" aria-live="polite" class="result-list">
            <div class="no-results">
                <span class="material-icons-round">search_off</span>
                <p>Click the button to extract PCA from current email.</p>
            </div>
        </div>
    </div>

    <div class="card" id="inboxSection" style="display: none;">
        <div class="section-header">
            <h2>Inbox Search Results</h2>
        </div>
        <div id="inboxResults" aria-live="polite" class="result-list">
            <div class="no-results">
                <span class="material-icons-round">inbox</span>
                <p>Click the button to find PCA in inbox emails.</p>
            </div>
        </div>
    </div>

    <!-- Toast notification container -->
    <div id="toast" class="toast">
        <span class="material-icons-round">info</span>
        <span id="toastMessage"></span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
